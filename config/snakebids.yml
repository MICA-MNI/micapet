# MICA-PET Pipeline Configuration
# ================================
# This configuration file defines the BIDS inputs and CLI arguments
# for the MICA-PET neuroimaging pipeline.

# Print command output to console as it happens (for debugging)
output_mode: "stream"
print_command: true

# --- BIDS Input Configuration ----PET Pipeline Configuration
# ================================
# This configuration file defines the BIDS inputs and CLI arguments
# for the MICA-PET neuroimaging pipeline.

# --- Debug Configuration ---
# Enable output streaming and command printing for debugging

debug:
  print_commands: true
  stream_output: true


# --- BIDS Input Configuration ---
# Defines how to find and parse input files from the BIDS dataset

pybids_inputs:
  T1w:
    filters:
      suffix: 'T1w'
      extension: '.nii.gz'
      datatype: 'anat'
      scope: 'raw'
    wildcards:
      - subject
      - session

  pet:
    filters:
      suffix: 'pet'
      extension: '.nii.gz'
      datatype: 'pet'
      scope: 'raw'
    wildcards:
      - subject
      - session
      - tracer


# --- Analysis Levels ---
# BIDS App standard analysis levels

analysis_levels:
  - participant


# --- Target Rules by Analysis Level ---
# Maps analysis levels to snakemake target rules

targets_by_analysis_level:
  participant:
    - ''  # Empty string means use the first rule (rule all)


# --- Pipeline Configuration ---
# Default values for pipeline parameters

# MICA-PET version used for derivatives folder naming
mica_pet_version: 'v.alpha.0.3'

# Processing options with defaults
psf: 4.5                    # Scanner PSF FWHM in mm
ref_region: 'pons'          # Options: pons, cerebellarGM, composite, none
pvc_method: 'rbv'           # Options: rbv, MG, IY
threads: 8                  # Threads for multithreaded steps


# --- Custom CLI Arguments ---
# These arguments are added to the command-line interface
# Each entry becomes a call to argparse.add_argument()

parse_args:
  --fastsurfer-img:
    help: "Path to FastSurfer Singularity image (.sif)"
    dest: fastsurfer_img
  
  --hippunfold-img:
    help: "Path to HippUnfold Singularity image (.sif)"
    dest: hippunfold_img
  
  --fs-license:
    help: "Path to FreeSurfer license.txt"
    dest: fs_license
    required: true
  
  --psf:
    help: "Scanner PSF FWHM in mm (default: 4.5)"
    dest: psf
    type: float
    default: 4.5
  
  --ref-region:
    help: "Reference region for SUVR (pons, cerebellarGM, composite, none)"
    dest: ref_region
    default: "pons"
    choices:
      - pons
      - cerebellarGM
      - composite
      - none
# added pvc-method arg
  --pvc-method:
    help: "Partial volume correction method (rbv, MG, IY)"
    dest: pvc_method
    default: "rbv"
    choices:
      - rbv
      - MG
      - IY
  
  --threads:
    help: "Number of threads for multithreaded steps (default: 8)"
    dest: threads
    type: int
    default: 8
  
  --hippunfold-cache-dir:
    help: "Path to hippunfold cache directory (optional)"
    dest: hippunfold_cache_dir
    default: ""
  
  --existing-freesurfer-dir:
    help: "Path to existing FastSurfer/FreeSurfer outputs directory (optional). If provided, will create symlinks instead of running FastSurfer."
    dest: existing_freesurfer_dir
    default: ""
  
  --existing-hippunfold-dir:
    help: "Path to existing HippUnfold outputs directory (optional). If provided, will create symlinks instead of running HippUnfold."
    dest: existing_hippunfold_dir
    default: ""

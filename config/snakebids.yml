# MICA-PET Pipeline Configuration
# ================================
# This configuration file defines the BIDS inputs and CLI arguments
# for the MICA-PET neuroimaging pipeline.

# Print command output to console as it happens (for debugging)
output_mode: "stream"
print_command: true

# --- BIDS Input Configuration ----PET Pipeline Configuration
# ================================
# This configuration file defines the BIDS inputs and CLI arguments
# for the MICA-PET neuroimaging pipeline.

# --- Debug Configuration ---
# Enable output streaming and command printing for debugging

debug:
  print_commands: true
  stream_output: true


# --- BIDS Input Configuration ---
# Defines how to find and parse input files from the BIDS dataset

pybids_inputs:
  T1w:
    filters:
      suffix: 'T1w'
      extension: '.nii.gz'
      datatype: 'anat'
      scope: 'raw'
    wildcards:
      - subject
      - session

  pet:
    filters:
      suffix: 'pet'
      extension: '.nii.gz'
      datatype: 'pet'
      scope: 'raw'
    wildcards:
      - subject
      - session
      - tracer


# --- Analysis Levels ---
# BIDS App standard analysis levels

analysis_levels:
  - participant


# --- Target Rules by Analysis Level ---
# Maps analysis levels to snakemake target rules

targets_by_analysis_level:
  participant:
    - ''  # Empty string means use the first rule (rule all)


# --- Pipeline Configuration ---
# Default values for pipeline parameters

# MICA-PET version used for derivatives folder naming
# mica_pet_version: 'v.alpha.0.5'

# Processing options with defaults
psf: 4.5                    # Scanner PSF FWHM in mm
ref_region: 'pons'          # Options: pons, cerebellarGM, composite, none
pvc_method: 'RBV-FS'        # Options: Freesurfer: RBV-FS; PETPVC: MG, IY, LABBE, RL, VC, RBV, LABBE+RBV, RBV+VC, RBV+RL, LABBE+RBV+VC, LABBE+RBV+RL, MTC, LABBE+MTC, MTC+VC, MTC+RL, LABBE+MTC+VC, LABBE+MTC+RL, IY+VC, IY+RL, MG+VC, MG+RL 
threads: 8                  # Threads for multithreaded steps

# --- Custom CLI Arguments ---
# These arguments are added to the command-line interface
# Each entry becomes a call to argparse.add_argument()

parse_args:
  --fastsurfer-img:
    help: "Path to FastSurfer Singularity image (.sif)"
    dest: fastsurfer_img
  
  --hippunfold-img:
    help: "Path to HippUnfold Singularity image (.sif)"
    dest: hippunfold_img
  
  --fs-license:
    help: "Path to FreeSurfer license.txt"
    dest: fs_license
    required: true
  
  --psf:
    help: "Scanner PSF FWHM in mm (default: 4.5)"
    dest: psf
    type: float
    default: 4.5
  
  --ref-region:
    help: "Reference region for SUVR (pons, cerebellarGM, composite, none)"
    dest: ref_region
    default: "pons"
    choices:
      - pons
      - cerebellarGM
      - composite
      - none
# added pvc-method arg + pvc-mask, n_iter, n_deconv, smoothing
  --pvc-method:
    help: "Partial volume correction method (Options: 1) Freesurfer: RBV-FS; 2) PETPVC: MG, IY, LABBE, RL, VC, RBV, LABBE+RBV, RBV+VC, RBV+RL, LABBE+RBV+VC, LABBE+RBV+RL, MTC, LABBE+MTC, MTC+VC, MTC+RL, LABBE+MTC+VC, LABBE+MTC+RL, IY+VC, IY+RL, MG+VC, MG+RL. Default: RBV-FS)"
    dest: pvc_method
    default: "RBV-FS"
    choices:
      - RBV-FS
      - MG
      - IY
      - MG
      - IY
      - LABBE
      - RL
      - VC
      - RBV
      - LABBE+RBV
      - RBV+VC
      - RBV+RL
      - LABBE+RBV+VC
      - LABBE+RBV+RL
      - MTC
      - LABBE+MTC
      - MTC+VC
      - MTC+RL
      - LABBE+MTC+VC
      - LABBE+MTC+RL
      - IY+VC
      - IY+RL
      - MG+VC
      - MG+RL

  --pvc-mask:
    help: "Optional custom mask to use for PETPVC. Must be a 4D NIfTI with one ROI per frame. Sum across timeframes must be 1 at each voxel. Must be in FreeSurfer/FastSurfer space (eg. orig.mgz). If not provided, a two tissue mask will be generated for MG PVC and a GM+WM+CSF+background mask will be generated for all others."
    dest: pvc_mask
    default: ""

  --pvc-n_iter:
    help: "Number of iterations for iterative PVC methods (IY) (default: 10)"
    dest: pvc_n_iter
    type: int
    default: 10
  
  --pvc-n_deconv:
    help: "Number of iterations for deconvolution PVC methods (RL, VC) (default: 10)"
    dest: pvc_n_deconv
    type: int
    default: 10

  --smoothing: 
    help: "List of smoothing FWHM in mm for surface projection. eg. --smoothing 5 10 (default: 0, no smoothing)"
    dest: smoothing
    type: float
    nargs: '*'
    default: 10
  
  --threads:
    help: "Number of threads for multithreaded steps (default: 8)"
    dest: threads
    type: int
    default: 8
  
  --hippunfold-cache-dir:
    help: "Path to hippunfold cache directory (optional)"
    dest: hippunfold_cache_dir
    default: ""
  
  --existing-freesurfer-dir:
    help: "Path to existing FastSurfer/FreeSurfer outputs directory (optional). If provided, will create symlinks instead of running FastSurfer."
    dest: existing_freesurfer_dir
    default: ""
  
  --existing-hippunfold-dir:
    help: "Path to existing HippUnfold outputs directory (optional). If provided, will create symlinks instead of running HippUnfold."
    dest: existing_hippunfold_dir
    default: ""

  --skip-hippunfold:
    help: "Flag to skip HippUnfold processing (optional). If set, will not run HippUnfold and will not require HippUnfold outputs."
    dest: skip_hippunfold
    action: 'store_true'
    default: false